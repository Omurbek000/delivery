services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      # 5432/5433 заняты локальным Postgres/wslrelay — наружу выставляем 5434
      - "127.0.0.1:5434:5432"
    volumes:
      # postgres:18 хранит данные в /var/lib/postgresql/18/docker — volume монтируем выше
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # 6379 занят локальным redis (wslrelay) — наружу выставляем 6380
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py demo_data || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload"
    volumes:
      - .:/app
      - media:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD:-admin}@db:5432/delivery
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
